<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sovereign AI Workspace | Intelligent Multi-Provider Gateway</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Sovereign AI Infrastructure, OmniRoute Multi-Provider Gateway, and Caveman Prompt Compression.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-color: #818cf8;
      --text-color-base: #e2e8f0;
      --bg-color: #0b0f19;
      --sidebar-bg: #070a12;
      --sidebar-text: #94a3b8;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background-color: #0b0f19 !important;
      color: #e2e8f0 !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }
    .sidebar {
      background-color: #060911 !important;
      border-right: 1px solid #1e293b !important;
      width: 280px !important;
    }
    .sidebar-nav {
      padding: 10px 0 30px 15px !important;
    }
    .sidebar-nav a {
      color: #94a3b8 !important;
      font-size: 0.96rem !important;
      transition: all 0.2s ease !important;
      border-left: 2px solid transparent !important;
      padding-left: 8px !important;
      display: inline-block !important;
    }
    .sidebar-nav a:hover {
      color: #a5b4fc !important;
      border-left-color: #a5b4fc !important;
      padding-left: 12px !important;
    }
    .sidebar-nav li.active > a {
      color: #818cf8 !important;
      font-weight: 600 !important;
      border-left-color: #818cf8 !important;
      text-shadow: 0 0 10px rgba(129, 140, 248, 0.3) !important;
    }
    .app-name-link {
      font-weight: 700;
      color: #a5b4fc !important;
      font-size: 1.15rem;
    }
    /* Expanded Fluid Widescreen Layout */
    .content {
      padding-top: 20px !important;
      max-width: 100% !important;
    }
    .markdown-section {
      max-width: 95% !important;
      margin: 0 auto !important;
      padding: 30px 35px 80px 35px !important;
      font-size: 1rem !important;
      line-height: 1.7 !important;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace !important;
    }
    pre {
      background-color: #070a13 !important;
      border: 1px solid #1e293b !important;
      border-left: 3px solid #818cf8 !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
      font-size: 0.95rem !important;
    }
    code {
      color: #a5b4fc !important;
      background-color: rgba(129, 140, 248, 0.1) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-size: 0.92rem !important;
    }
    pre code {
      color: #e2e8f0 !important;
      background-color: transparent !important;
      padding: 0 !important;
    }
    .markdown-section blockquote {
      border-left: 4px solid #818cf8;
      background: rgba(129, 140, 248, 0.05);
      color: #cbd5e1;
      border-radius: 0 8px 8px 0;
      padding: 12px 20px;
      font-size: 1rem !important;
    }
    .markdown-section h1 { 
      color: #a5b4fc; 
      letter-spacing: -0.02em !important;
      border-bottom: 2px solid #1e293b !important;
      padding-bottom: 12px !important;
    }
    .markdown-section h2 { 
      color: #818cf8; 
      border-bottom: 1px solid #1e293b; 
      padding-bottom: 8px; 
      margin-top: 3rem;
    }
    .markdown-section h3 { color: #38bdf8; margin-top: 2rem; }
    
    /* High-Contrast Spacious Dark Hacker Table */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 24px 0 !important;
      background-color: #0d1322 !important;
      border: 1px solid #1e293b !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }
    .markdown-section table tr {
      background-color: #0b0f19 !important;
      border-top: 1px solid #1e293b !important;
      border-bottom: 1px solid #1e293b !important;
      transition: background-color 0.15s ease !important;
    }
    .markdown-section table tr:nth-child(2n) {
      background-color: #131b2e !important;
    }
    .markdown-section table tr:hover {
      background-color: #1e293b !important;
    }
    .markdown-section table th {
      background-color: #161e2e !important;
      color: #a5b4fc !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      border: 1px solid #334155 !important;
      padding: 12px 16px !important;
      text-align: left !important;
    }
    .markdown-section table td {
      color: #f8fafc !important;
      border: 1px solid #1e293b !important;
      padding: 12px 16px !important;
      font-size: 0.95rem !important;
    }
    .markdown-section table td code {
      background-color: #1e293b !important;
      color: #a5b4fc !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      font-size: 0.9rem !important;
    }

    /* Mermaid Diagram Sizing & Centering: Crisp, Compact & Proportional */
    .mermaid {
      text-align: center !important;
      margin: 2rem auto !important;
      overflow-x: auto !important;
      display: flex !important;
      justify-content: center !important;
    }
    .mermaid svg {
      max-width: 820px !important;
      width: 100% !important;
      height: auto !important;
      margin: 0 auto !important;
      display: block !important;
    }

    /* Mermaid Global High-Contrast SVG Typography */
    .mermaid svg text,
    .mermaid svg text *,
    .mermaid svg tspan,
    .mermaid svg text.actor,
    .mermaid svg text.taskText,
    .mermaid svg text.sectionTitle {
      fill: #f8fafc !important;
      color: #f8fafc !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-weight: 500 !important;
    }
    .mermaid svg text.sectionTitle {
      fill: #a5b4fc !important;
      font-weight: 700 !important;
    }
    .mermaid svg text.timeline-title {
      fill: #818cf8 !important;
      font-size: 1.15rem !important;
      font-weight: 700 !important;
      text-anchor: middle !important;
    }

    /* Sequence Diagram Participant Boxes Hardening */
    .mermaid svg rect.actor {
      fill: #161e2e !important;
      stroke: #818cf8 !important;
      stroke-width: 1.5px !important;
    }
    .mermaid svg line.actor-line {
      stroke: #334155 !important;
    }
    .mermaid svg text.actor {
      fill: #f8fafc !important;
      font-weight: 600 !important;
    }
    .mermaid svg .messageText {
      fill: #e2e8f0 !important;
      font-size: 0.88rem !important;
    }
    .mermaid svg .noteText {
      fill: #f8fafc !important;
    }
    .mermaid svg rect.note {
      fill: #0f172a !important;
      stroke: #818cf8 !important;
    }
  </style>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#070a13',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#818cf8',
        lineColor: '#818cf8',
        secondaryColor: '#0f172a',
        tertiaryColor: '#111827',
        textColor: '#f8fafc',
        mainBkg: '#0d1322',
        nodeBorder: '#818cf8',
        clusterBkg: '#090e1a',
        clusterBorder: '#1e293b',
        defaultLinkColor: '#818cf8',
        titleColor: '#a5b4fc',
        edgeLabelBackground: '#0b0f19',
        actorTextColor: '#f8fafc',
        actorBkg: '#1e293b',
        actorBorder: '#818cf8',
        signalColor: '#f8fafc',
        signalTextColor: '#f8fafc',
        labelTextColor: '#f8fafc',
        fontFamily: 'Inter, sans-serif'
      }
    });
  </script>
</head>
<body>
  <div id="app">Loading sovereign AI documentation...</div>
  <script>
    window.$docsify = {
      name: '🧠 Sovereign AI',
      repo: 'https://github.com/Lessa-github/sovereign-ai-workspace',
      loadSidebar: '_sidebar.md?t=' + Date.now(),
      loadNavbar: '_navbar.md?t=' + Date.now(),
      subMaxLevel: 2,
      search: {
        placeholder: 'Search gateways & compression...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return ('<div class="mermaid">' + code + "</div>");
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            mermaid.run();
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
